<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SMA Practice Dashboard</title>
<style>
:root{--bg:#f4f6f3;--panel:#fff;--ink:#111;--ink2:#5a6558;--line:#ccd4c9;
  --brand:#14532d;--good:#15803d;--bad:#b91c1c;--warn:#a16207;--r:13px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  padding-bottom:90px}
header{position:sticky;top:0;z-index:30;background:var(--brand);color:#fff;padding:12px 14px;
  display:flex;align-items:center;gap:10px}
.hd{flex:1;min-width:0}.hd b{display:block;font-size:16px;font-weight:800}
.hd span{display:block;font-size:11.5px;opacity:.9;font-weight:700}
.gear{background:rgba(255,255,255,.18);border:0;color:#fff;border-radius:9px;height:38px;
  padding:0 12px;font-size:14px;font-weight:800;cursor:pointer}
main{padding:14px;max-width:900px;margin:0 auto}
.view{display:none}.view.on{display:block}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:15px;margin-bottom:12px}
h2{font-size:19px;margin:0 0 10px}
h3{font-size:11px;margin:16px 0 8px;color:var(--ink2);text-transform:uppercase;letter-spacing:.6px;font-weight:800}
h3:first-child{margin-top:0}
.muted{color:var(--ink2);font-size:13.5px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.grid{display:grid;gap:8px}.g3{grid-template-columns:repeat(3,1fr)}
hr{border:0;border-top:1px solid var(--line);margin:14px 0}
label{display:block;font-size:11px;font-weight:800;color:var(--ink2);text-transform:uppercase;letter-spacing:.5px;margin:0 0 4px}
input,select,textarea{width:100%;font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);
  border-radius:10px;background:#fff;color:var(--ink);min-height:44px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:10px 15px;
  border-radius:11px;border:1px solid var(--line);background:#fff;color:var(--ink);font:inherit;
  font-weight:800;font-size:15px;cursor:pointer}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{min-height:34px;padding:5px 10px;font-size:13px;border-radius:8px}
.btn.wide{width:100%}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;background:var(--panel);
  border-top:1px solid var(--line)}
nav.tabs button{flex:1;border:0;background:none;padding:10px 4px;font:inherit;font-size:12px;font-weight:800;
  color:var(--ink2);display:flex;flex-direction:column;align-items:center;gap:3px;min-height:58px;cursor:pointer}
nav.tabs button .ic{font-size:19px;line-height:1}
nav.tabs button.on{color:var(--brand)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left}
th{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink2);background:#f0f3ef}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}
.mv{padding:9px 12px;border-radius:10px;margin-bottom:6px;font-size:14.5px;border:1px solid var(--line)}
.mv.up{background:#dcfce7;border-color:var(--good)}
.mv.dn{background:#fee2e2;border-color:var(--bad)}
.mv.coachnote{background:#eef2ff;border-color:#6366f1}
.up{color:var(--good);font-weight:800}.dn{color:var(--bad);font-weight:800}
.li{padding:10px 12px;border-bottom:1px solid var(--line);background:#fff;display:flex;gap:10px;align-items:flex-start}
.li:last-child{border-bottom:0}
.li .n{font-family:ui-monospace,Menlo,monospace;font-weight:900;color:var(--ink2);min-width:26px;font-size:13px}
.li .b{flex:1;min-width:0}
.li .raw{font-size:15px;font-weight:700;word-break:break-word}
.li .say{color:var(--ink2);font-size:12.5px;margin-top:2px}
.li.edited{background:#eff6ff;box-shadow:inset 3px 0 0 #2563eb}
.li.warn{background:#fffbeb}
.log{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tag{display:inline-block;padding:2px 8px;border-radius:5px;font-size:11px;font-weight:800;background:#e8ece7;color:var(--ink2)}
.tag.warn{background:#fef3c7;color:#713f12}
.tag.blue{background:#dbeafe;color:#1e40af}
.okbox{background:#dcfce7;border:1px solid var(--good);border-radius:10px;padding:11px 13px;font-size:13.5px;font-weight:700}
.warnbox{background:#fef3c7;border:1px solid var(--warn);border-radius:10px;padding:11px 13px;font-size:13.5px;font-weight:700}
.bluebox{background:#dbeafe;border:1px solid #2563eb;border-radius:10px;padding:11px 13px;font-size:13.5px;font-weight:700;color:#1e3a8a}
.empty{text-align:center;color:var(--ink2);padding:26px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:74px;background:#111;color:#fff;
  padding:10px 18px;border-radius:999px;font-weight:800;font-size:14px;z-index:200}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:150;display:flex;align-items:flex-end;justify-content:center}
.modal{background:#fff;border-radius:17px 17px 0 0;padding:18px;width:100%;max-width:640px;max-height:90vh;overflow:auto}
code{background:#eef1ed;padding:1px 5px;border-radius:4px;font-family:ui-monospace,Menlo,monospace;font-size:13px}
@media print{header,nav.tabs,.noprint{display:none!important}body{padding:0;background:#fff}
  main{padding:0;max-width:none}.card{border:1px solid #ccc;break-inside:avoid}@page{margin:.5in}}
</style>
</head>
<body>
<header>
  <div class="hd"><b id="hdT">Practice Dashboard</b><span id="hdS"></span></div>
  <button class="gear" id="btnPrint">Print</button>
  <button class="gear" id="btnMore">⚙</button>
</header>
<main>
  <section class="view on" id="v-board"><div id="boardArea"></div></section>
  <section class="view" id="v-coach"><div id="coachArea"></div></section>
  <section class="view" id="v-plays"><div id="playsArea"></div></section>
  <section class="view" id="v-game"><div id="gameArea"></div></section>
  <section class="view" id="v-more"><div id="moreArea"></div></section>
</main>
<nav class="tabs">
  <button data-view="board" class="on"><span class="ic">◆</span>The board</button>
  <button data-view="coach"><span class="ic">▲</span>For coaches</button>
  <button data-view="plays"><span class="ic">≡</span>Every play</button>
  <button data-view="game"><span class="ic">★</span>Games</button>
</nav>

  "reached reaches " +
  "made makes make crossed cross went goes go " +
  "to for a an of the and then who that it him her his their they he she " +

const OUTCOMES = {

  oob: ["oob", "sideline", "bounds"],

  incomplete: ["incomplete", "inc", "overthrown", "overthrew", "underthrown", "missed", "wide", "short", "sailed", "pbu"],
  drop: ["drop", "dropped", "drops", "d"],
  int: ["int", "interception", "intercepted", "intercepts", "picks", "pick", "picked"],
  fumble: ["fumble", "fumbled", "fumbles", "f"],
  whistle: ["whistle", "blown", "dead", "blew"]

  drop_fumble: ["fumble", "fumbled", "bobbled"],
  catch: ["catch", "caught", "catches", "complete", "completed", "c", "good", "perfect",
    "grabbed", "grab", "snagged", "snag", "secured", "corralled", "hauled"],
  drop: ["drop", "dropped", "drops", "d"],

function parseLine(text, ctx) {
  ctx = ctx || { kind: "play", startAbs: 40 };

  if (!raw) return null;

  /* ---- Down and distance -------------------------------------------------
     "second and six", "3rd and 2", "first and 15", "first and goal", "4th and

    const DOWNW = { first: 1, second: 2, third: 3, fourth: 4, "1": 1, "2": 2, "3": 3, "4": 4 };
    const m = dl.match(/^\s*(?:it(?:'|\u2019)?s\s+)?(first|second|third|fourth|1st|2nd|3rd|4th|[1-4])\s*(?:and|&|\+)\s*(goal|inches|inch|g|\d{1,2}|one|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve|thirteen|fourteen|fifteen|sixteen|seventeen|eighteen|nineteen|twenty)\s*(?:for\s+(?:the\s+)?(?:bears|rams|us|them)\s*)?$/);

    .match(/\b(?:a\s+)?(terrible|awful|really bad|bad|poor|rough|low|high|wide|off|perfect|great|really good|pretty good|good|solid|clean|mid)\s+snap\b[^.]*?\b(?:from|by)\s+#?([a-z0-9]+)/)

      ? canonNum(token.replace(/([ab])$/, c => c.toUpperCase()))

    const w = [];
    if (!who) w.push("Couldn't tell who \u201c" + token + "\u201d is");

  const gtHit = gt.match(new RegExp("^(?:that(?:(?:'|\u2019)?s| is|(?:'|\u2019)?s a| was) )?(?:an? )?(?:really |very |pretty |absolutely )?(?:good|great|nice|beautiful|strong|clean|solid|excellent|awesome)\\s+(?:tackle|tackles|hit|stop|grip|block|shock ?(?:and|n) ?lock|pushback|push back)\\b(?:\\s+(?:from|by|on))?\\s+#?(\\d{1,3}[ab]?)(?:\\s+and\\s+#?(\\d{1,3}[ab]?))?"))

  if (gtHit) {
    const men = [gtHit[1], gtHit[2]].filter(Boolean)
      .map(x => canonNum(x.replace(/([ab])$/, c => c.toUpperCase())));
    const w = men.filter(x => !isJersey(x)).map(x => "#" + x + " isn't on the roster");

  }

  /* "13 past 12, through, donut" — one man against one man. Deliberately not
     scored: whether a juke is good or bad is a coaching call, not a stat. */

    .replace(/[.,]/g, " ").replace(/\s+/g, " ").trim()
    .match(/^#?(\d{1,3}|[a-z]+)\s+(past|beat|through|got past|escaped|stopped by|held by|locked by|stuck on)\s+#?(\d{1,3}|[a-z]+)\b(.*)$/);
  if (mu) {
    const off = /^\d+$/.test(mu[1]) ? mu[1] : numFromName(mu[1]);
    const def = /^\d+$/.test(mu[3]) ? mu[3] : numFromName(mu[3]);
    const escaped = !/stopped by|held by|locked by|stuck on/.test(mu[2]);
    const rest = " " + (mu[4] || "") + " ";
    const method = /juke|jukes|juked|around|past him|avoid/.test(rest) ? "juke"
      : /through|tackle|barrel|bull|power|straight/.test(rest) ? "through" : null;

      : /donut|doughnut|pad/.test(rest) ? true : null;

      : /quick|short|barely|no.*tackle|straight past/.test(rest) ? "short" : null;
    const w = [];
    if (!off) w.push("Couldn't tell who \u201c" + mu[1] + "\u201d is");
    if (!def) w.push("Couldn't tell who \u201c" + mu[3] + "\u201d is");

  }

     sure it's right. */
  const bare = raw.trim();
  if (/^[*\?]+$/.test(bare))
    return { kind: "gap", warnings: ["A play you missed \u2014 fill it in if you find out"], notes: [] };
  const starred = bare.indexOf("*") > -1;

  raw = raw.replace(/\*+/g, " ");             /* strip them before reading the words */
  let pre = " " + String(raw).toLowerCase().replace(/[,.;!?]/g, " ").replace(/-/g, " ") + " ";

      const prevTok = words[i - 1] || "";

      if (isJersey(n)) { chain.push(pn); verbs.push(handoff ? "hand" : "pass"); handoff = false; continue; }

    if (tok === "gainof") { wantGain = true; wantYard = false; continue; }
    if (tok === "loss") { negative = true; wantGain = true; wantYard = false; continue; }
    if (tok === "nogain") { gainN = 0; wantYard = false; continue; }

    if (wantBy && !["the", "a", "an", "number", "player", "jersey"].includes(tok)) wantBy = false;

    if (CLEAR.includes(tok)) { wantYard = false; continue; }
    if (/^(snapped|snaps|snap|hiked|hikes|hike|centered|centers)$/.test(tok)) { sawSnap = true; continue; }

    if (tok === "snaphigh")  { snapGrade = "high";  sawSnap = true; continue; }
    if (tok === "snapwide")  { snapGrade = "wide";  sawSnap = true; continue; }
    if (tok === "snapclean") { snapGrade = "clean"; sawSnap = true; continue; }

    if (PASSTO.includes(tok)) { wantYard = false; continue; }

    if (ctx.kind === "rep" && rc) { repres = rc; wantYard = false; continue; }

       doesn't change what went wrong. */
    if (oc) { if (outcome !== "badsnap") outcome = oc;
      wantYard = false; wantGain = false; expectMore = false; andJustNow = false; continue; }
    if (rc) { repres = rc; wantYard = false; continue; }
    /* "passes the bowl to four" — a typo shouldn't leave "the" still expecting a
       yard line, or the receiver gets read as one. Anything unrecognised clears it. */
    wantYard = false;
    unknown.push(tok);   /* only worth raising if the play didn't come through */
  }

     how passing actually gets recorded. A line with "to" is a single throw
     instead, so that keeps working. ---- */
  if (ctx.kind === "rep" && !words.some(t => PASSTO.includes(t))) {
    const tally = readTally(words);
    if (tally) return tally;
  }
  if (ctx.kind === "rep") {
    if (!repres && outcome === "drop") repres = "drop";
    const o = { kind: "rep", passer: chain[0] || null, receiver: chain[1] || chain[0] || null,
      result: repres, warnings: w, notes: note };

       than jerseys. Letting one through invents players and credits them. */
    if (p.partial) return;
    if (p.kind === "snapgrade") {
      const r = get(p.who);
      r.snaps++; r.snapsGraded++;
      if (p.off) r.snapsOff++;
      return;
    }
    if (p.kind === "tally") {
      const r = get(p.who);
      r.catches += p.counts.catch; r.drops += p.counts.drop;
      r.targets += p.counts.catch + p.counts.drop;
      r.uncatchable += p.counts.bad_throw;
      return;
    }
    if (p.kind === "rep" && p.receiver && p.result) {
      const r = get(p.receiver);
      if (p.result === "bad_throw") r.uncatchable++;
      else { r.targets++; p.result === "catch" ? r.catches++ : r.drops++; }
      if (p.passer && p.passer !== p.receiver) { const t = get(p.passer);
        t.throws++; if (p.result === "bad_throw") t.badThrows++; }
      return;
    }
    if (p.kind === "play" && p.chain && p.chain.length && !p.outcome) {
      /* You saw the ball snapped even if you lost what happened after it.
         The snap counts; nothing downstream is assumed. */
      get(p.chain[0]).snaps++;
      if (p.chain[1]) get(p.chain[1]).snapsTaken++;
      return;
    }
    if (p.kind === "play" && p.chain && p.chain.length && p.outcome) {
      const ch = p.chain, n = ch.length, y = playYards(p);
      const failed = ["incomplete", "drop", "int"].includes(p.outcome);
      if (p.outcome === "badsnap") {
        if (!p.uncertainSnapper) { const sn = get(ch[0]);
          sn.snaps++; sn.badSnaps++; sn.snapsGraded++; sn.snapsOff++; }
        return; }
      for (let i = 0; i < n - 1; i++) {
        const th = get(ch[i]), ca = get(ch[i + 1]), last = i === n - 2;
        /* The centre snapping to the quarterback is not a pass, and taking a
           snap is not a catch. Counting it either way made the snapper look
           like a passer and the QB look like a 100% receiver. */
        if (i === 0 && p.noSnap) {
          /* In the 3by3 the first man passes; there is no centre. Crediting a
             snap here would quietly pad the snapper comparison. */
          th.att++; th.comp++; ca.rec++; ca.targets++; ca.catches++;
          if (last && y != null) { th.passYds += y; ca.recYds += y; }
          if (last && p.outcome === "touchdown") { th.passTd++; ca.recTd++; }
          continue;
        }
        if (i === 0) {
          if (!p.uncertainSnapper) {
            th.snaps++;

               though Major caught it. Ungraded snaps count as neither. */
            if (p.snapGrade) { th.snapsGraded++; if (p.snapGrade !== "clean") th.snapsOff++; }
          }
          ca.snapsTaken++;
          if (last) {
            if (failed) { if (p.outcome === "drop") ca.playDrops++; }
            else { ca.carries++;
              if (y != null) ca.rushYds += y;
              if (p.outcome === "touchdown") ca.recTd++; }
          }
          continue;
        }
        if ((p.verbs || [])[i + 1] === "hand") {          // a handoff is not a throw
          if (last && (p.outcome === "drop" || p.outcome === "fumble")) { ca.playDrops++; continue; }
          ca.carries++;
          if (last && y != null) ca.rushYds += y;
          if (last && p.outcome === "touchdown") ca.recTd++;
          continue;
        }
        th.att++;
        if (last && failed) {
          if (p.outcome === "drop") { ca.playDrops++; ca.targets++; ca.drops++; }
          if (p.outcome === "int") th.intThrown++;
        } else {
          th.comp++; ca.rec++; ca.targets++; ca.catches++;
          if (last && y != null) { th.passYds += y; ca.recYds += y; }
          if (last && p.outcome === "touchdown") { th.passTd++; ca.recTd++; }
        }
      }
      /* "? all I know is 40 made it to the 40" names one player but describes
         no snap. Only credit one if the note actually says he snapped it. */
      if (n === 1) { const s = get(ch[0]); if (p.sawSnap && !p.partial) s.snaps++;
        if (!failed) { if (y != null) s.rushYds += y;
          if (y != null) s.carries++;
          if (p.outcome === "touchdown") s.recTd++; } }
      if (p.outcome === "fumble") get(ch[n - 1]).fumbles++;
      (p.tacklers && p.tacklers.length ? p.tacklers : (p.tackler ? [p.tackler] : [])).forEach(t => {
        const d = get(t);
        if (p.outcome === "int") d.ints++; else if (p.outcome === "fumble") d.ff++;
        else if (["incomplete", "drop"].includes(p.outcome)) d.pbu++; else d.tackles++; });
    }
  });
  const duty = sharedDuty(mon);
  Object.keys(duty.snap).forEach(n => { get(n).snapsShared += duty.snap[n]; });
  Object.keys(duty.relay).forEach(n => { get(n).relayShared += duty.relay[n]; });
  return S;
}

/* ---------- weeks ---------- */
function mondayOf(ds) {
  const [y, m, d] = ds.split("-").map(Number);
  const dt = new Date(y, m - 1, d);
  dt.setDate(dt.getDate() - ((dt.getDay() + 6) % 7));
  return dt.getFullYear() + "-" + String(dt.getMonth() + 1).padStart(2, "0") + "-" + String(dt.getDate()).padStart(2, "0");
}
function weekLabel(mon) {
  const [y, m, d] = mon.split("-").map(Number);
  const f = x => x.toLocaleDateString([], { month: "short", day: "numeric" });
  return f(new Date(y, m - 1, d)) + " – " + f(new Date(y, m - 1, d + 4));
}
function weeks() {
  const set = {};
  BASELINE.practices.forEach(p => set[mondayOf(p.date)] = true);
  return Object.keys(set).sort().reverse();
}
function itemsInWeek(mon) {
  const ids = BASELINE.practices.filter(p => mondayOf(p.date) === mon).map(p => p.id);
  let out = [];
  BASELINE.drills.filter(d => ids.includes(d.practiceId)).forEach(d => { out = out.concat(readDrill(d.id)); });
  return out;
}
const prevWeek = mon => { const w = weeks(), i = w.indexOf(mon); return i >= 0 && i < w.length - 1 ? w[i + 1] : null; };
/* Everything the boy has done BEFORE this week, all of it, so a week is
   measured against his own normal rather than against one earlier week that
   might itself have been unusual. */
function itemsBefore(mon) {
  const ids = BASELINE.practices.filter(p => mondayOf(p.date) < mon).map(p => p.id);
  let out = [];
  BASELINE.drills.filter(d => ids.includes(d.practiceId)).forEach(d => { out = out.concat(readDrill(d.id)); });
  return out;
}
const hasBefore = mon => BASELINE.practices.some(p => mondayOf(p.date) < mon);

/* ==========================================================================
   AREAS — with gates, because 15 reps a drill moves a percentage around a lot
   on its own and a coach shouldn't ride a kid over four catches.
   ========================================================================== */
const MIN_SHOW = 3, MIN_TREND = 6;
const AREAS = [
  /* Snap QUALITY used to live here. It is gone on purpose: a snap only gets
     written down as bad when it was noticed, and Maddie has said she does not
     reliably catch bad ones — the coaches have her watching tackles, which is
     the other end of the play. Counts stay, judgements go. */
  { key:"throwing", label:"Throwing", unit:"%",
    att:s=>s.att, val:s=>pct(s.comp,s.att),
    detail:s=>s.comp+"/"+s.att+" completed"+(s.intThrown?", "+s.intThrown+" picked off":""), better:"up" },
  { key:"catching", label:"Catching", unit:"%",
    att:s=>s.targets, val:s=>pct(s.catches,s.targets),
    detail:s=>s.catches+"/"+s.targets+" caught", better:"up" },
  { key:"running", label:"Yards per carry", unit:"",
    att:s=>s.carries+s.rec,
    val:s=>(s.carries+s.rec)?Math.round((s.rushYds+s.recYds)/(s.carries+s.rec)*10)/10:null,
    detail:s=>(s.rushYds+s.recYds)+" yds on "+(s.carries+s.rec)+" touches", better:"up" },
  { key:"defense", label:"Defence", unit:"", volumeOnly:true,
    att:s=>s.tackles+s.ints+s.pbu+s.ff, val:s=>s.tackles+s.ints+s.pbu+s.ff,
    detail:s=>[s.tackles&&s.tackles+" tackles", s.ints&&s.ints+" INT",
      s.pbu&&s.pbu+" breakups", s.ff&&s.ff+" forced"].filter(Boolean).join(", ")||"—", better:"up" },
  { key:"security", label:"Drops per 10 touches", unit:"",
    att:s=>s.targets+s.carries+s.rec,
    val:s=>{ const t = s.targets + s.carries + s.rec;
      return t ? Math.round((s.drops + s.fumbles + s.playDrops) / t * 100) / 10 : null; },
    detail:s=>(s.drops+s.playDrops)+" drops"+(s.fumbles?", "+s.fumbles+" fumbles":"")
      +" in "+(s.targets+s.carries+s.rec)+" touches", better:"down" }
];
/* What a player actually did this week, in his own words rather than a
   depth chart. Six-man means everyone does several jobs. */
function roleOf(s) {
  if (!s) return "";
  const bits = [];
  if (s.snaps >= 3 || s.snapsShared >= 3) bits.push("snapping");
  if (s.relayShared >= 3) bits.push("relaying");
  if (s.att >= 3) bits.push("throwing");
  if (s.targets >= 3) bits.push("catching");
  if (s.carries + s.rec >= 3) bits.push("carrying");
  if (s.tackles + s.ints + s.pbu + s.ff >= 2) bits.push("on defence");
  return bits.join(" · ");
}
/* Coach feedback outranks anything computed here, so it is shown first. */
function coachNotesFor(num, weekMon) {
  return (BASELINE.coachNotes || []).filter(c =>
    String(c.num) === String(num) && (!weekMon || mondayOf(c.date) === weekMon));
}
function teamCoachNotes(weekMon) {
  return (BASELINE.coachNotes || []).filter(c => !c.num && (!weekMon || mondayOf(c.date) === weekMon));
}
/* Praise is worth flagging. A coaching point is not a black mark, so it gets
   no warning colour and no downward arrow. */
function noteMark(tone) { return tone === "praise" ? "★" : "•"; }
function noteBlock(c) {
  const cls = c.tone === "praise" ? "up" : "coachnote";
  return `<div class="mv ${cls}">${noteMark(c.tone)} <b>${esc(c.by)}</b>
    <span class="muted">${esc(dateLabel(c.date))}${c.during ? " · " + esc(c.during) : ""}</span><br>
    ${esc(c.text)}</div>`;
}
/* Being injured is a thing that happened in a stretch of weeks, not a permanent
   label. A player who is fit now should read as fit now and still read as out when
   you look back at the weeks he missed, so `out` holds the periods and the badge is
   worked out against whichever week is on screen. No badge means available — that
   is the normal state and does not need announcing. */
function outSpell(num, when) {
  const p = BASELINE.players.find(x => String(x.num) === String(num));
  if (!p || !Array.isArray(p.out)) return null;
  const d = when || todayISO();
  return p.out.find(o => d >= o.from && (!o.to || d <= o.to)) || null;
}
function statusOf(num, when) {
  const sp = outSpell(num, when);
  if (sp) return sp.why || "out \u2014 injured";
  const p = BASELINE.players.find(x => String(x.num) === String(num));
  const st = p && p.status ? p.status : "active";
  return (st === "available") ? "active" : st;
}
function todayISO() { const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function noteOf(num) {
  const p = BASELINE.players.find(x => String(x.num) === String(num));
  return p && p.note ? p.note : "";
}
function areaRows(now, was) {
  return AREAS.map(a => {
    const nA = now ? a.att(now) : 0, wA = was ? a.att(was) : 0;
    if (nA < MIN_SHOW && wA < MIN_SHOW) return null;
    const nv = nA >= MIN_SHOW ? a.val(now) : null;
    const wv = wA >= MIN_SHOW ? a.val(was) : null;
    let delta = null, solid = false;
    if (nv != null && wv != null) { delta = Math.round((nv - wv) * 10) / 10;
      solid = nA >= MIN_TREND && wA >= MIN_TREND; }
    return { a, nv, wv, nAtt:nA, wAtt:wA, delta, solid, detail: nA ? a.detail(now) : "", dir: a.better };
  }).filter(Boolean);
}
const fmtVal = r => r.nv == null ? "—" : (r.a.unit === "%" ? r.nv.toFixed(0) + "%" : String(r.nv));
function moveWord(r) {
  /* Counting stats rise and fall with how much got recorded, so they are shown
     but never described as a player getting better or worse. */
  if (r.a.volumeOnly) return null;
  if (r.delta == null || !r.solid || Math.abs(r.delta) < (r.a.unit === "%" ? 5 : 0.5)) return null;
  const better = r.dir === "up" ? r.delta > 0 : r.delta < 0;
  return { better, txt: (r.delta > 0 ? "+" : "") + r.delta + (r.a.unit === "%" ? " pts" : "") };
}

<script>
"use strict";
/* ==========================================================================
   VIEWS
   ========================================================================== */
let VIEW = "board", WEEK = null, OPENDRILL = null;
function go(v) {
  VIEW = v;
  $$(".view").forEach(s => s.classList.toggle("on", s.id === "v-" + v));
  $$("nav.tabs button").forEach(b => b.classList.toggle("on", b.dataset.view === v));
  render(); window.scrollTo(0, 0);
}
function render() {
  $("#hdT").textContent = BASELINE.team;
  const n = editCount();
  $("#hdS").textContent = BASELINE.practices.length
    ? BASELINE.practices.length + " practices · " + LINES().length + " plays"
      + (n ? " · " + n + " correction" + (n === 1 ? "" : "s") : "")
    : "waiting for your first practice";
  ({ board: renderBoard, coach: renderCoach, plays: renderPlays, game: renderGame, more: renderMore }[VIEW] || renderBoard)();
}

function editBanner() {
  if (!isOwner()) return "";                   // coaches see the record, not the workings
  if (!editCount()) return "";
  return `<div class="bluebox noprint" style="margin-bottom:12px">
    You've made ${editCount()} correction${editCount() === 1 ? "" : "s"} to this dashboard.
    ${EDITSOK ? "" : "<b>This browser isn't keeping them — send them now or they'll be lost.</b><br>"}
    <button class="btn sm" style="margin-top:7px" onclick="sendCorrections()">Send my corrections</button>
  </div>`;
}

/* ---------- for coaches ---------- */
/* ==========================================================================
   YARDAGE — gains and losses.

   Only from drills where a yard number means something. Two kinds are thrown
   out on purpose:
     · movingStart — the ball advances between plays, so start and end are not
       on the same footing and a "gain" is meaningless
     · reversed    — the goal line drill ran the other way down the field, so a
       yard number could belong to either end
   Everything excluded is counted and shown, so the number is never quietly
   smaller than the football that actually happened.
   ========================================================================== */
function yardsUsable(d) { return !!d && !d.movingStart && !d.reversed && !d.noYards; }

function yardTotals(week) {
  const per = {}, get = n => (per[n] = per[n] || {
    touches: 0, yds: 0, best: null, worst: null, tds: 0, noRead: 0 });
  let plays = 0, measured = 0, dropped = 0, skippedDrills = [];

  BASELINE.drills.forEach(d => {
    const pr = practiceOf(d.practiceId);
    if (!pr) return;
    if (week && mondayOf(pr.date) !== week) return;
    if (!yardsUsable(d)) { skippedDrills.push(d.name + " (" + dateLabel(pr.date) + ")"); return; }
    readDrill(d.id).forEach(r => {
      const p = r.p;
      if (!p || p.kind !== "play" || !p.chain || !p.chain.length) return;
      plays++;
      const carrier = p.chain[p.chain.length - 1];
      const y = playYards(p);
      if (y == null) { dropped++; get(carrier).noRead++; return; }
      measured++;
      const s = get(carrier);
      s.touches++; s.yds += y;
      if (s.best === null || y > s.best) s.best = y;
      if (s.worst === null || y < s.worst) s.worst = y;
      if (p.outcome === "touchdown") s.tds++;

}

/* ==========================================================================
   TACKLES WORTH NAMING
   Coach asked for these. They are NOT a tackle count — Maddie cannot see every
   tackle and has said so. These are the ones she watched, thought were good,
   and said out loud. A boy missing from this list has not failed to tackle;
   he has failed to be looked at while doing it.

function goodTackles(week) {
  const per = {};
  const add = (num, text, date, drill) => {
    (per[num] = per[num] || []).push({ text, date, drill });
  };
  BASELINE.drills.forEach(d => {
    const pr = practiceOf(d.practiceId);
    if (!pr) return;
    if (week && mondayOf(pr.date) !== week) return;
    readDrill(d.id).forEach(r => {
      const p = r.p;
      if (!p) return;
      if (p.kind === "goodtackle") (p.men || []).forEach(m => add(m, p.text, pr.date, d.name));
      else if (p.goodTackles && p.goodTackles.length)
        (p.goodTackles).forEach(m => add(m, r.line.raw, pr.date, d.name));
    });
  });
  /* Some of these were written down as notes rather than as plays, before there
     was a section for them. Same observation, same person, so they belong here. */
  (BASELINE.coachNotes || []).forEach(c => {
    if (!c.num || !c.text) return;
    if (week && mondayOf(c.date) !== week) return;
    if (!/tackle|hit\b|shock ?(?:and|n) ?lock|pushback|push back|block|brought him down|stop(?:ped)?\b/i.test(c.text)) return;
    if (!/good|great|nice|beautiful|strong|clean|solid|excellent|awesome|commend/i.test(c.text)) return;
    add(c.num, c.text + (c.by && c.by !== "Maddie" ? " — " + c.by : ""), c.date, c.during || "");
  });

}

function goodTackleCard(week) {
  const per = goodTackles(week);
  const nums = Object.keys(per).sort((a, b) => per[b].length - per[a].length
    || (parseInt(a, 10) || 999) - (parseInt(b, 10) || 999));
  if (!nums.length) return "";
  /* Over a whole season this used to print every moment for every boy and ran to
     hundreds of lines — the exact thing the players said made the page unreadable.
     Counts first, a couple of examples each, the rest on request. */
  const full = !!week, SHOW = full ? 99 : 2;
  return `<div class="card">
    <h2 style="margin-top:0">Tackles worth naming</h2>
    <p class="muted" style="margin-bottom:10px"><b>Not a count of tackles.</b> These are the ones
      Maddie saw and said were good. Nobody is missing from this list because he failed to tackle
      anyone — he was tackling while she was watching something else.</p>
    ${nums.map(n => {
      const list = per[n], extra = list.length - SHOW;
      return `<div style="margin:0 0 10px">
        <b>${esc("#" + n + (nameOf(n) ? " " + nameOf(n) : ""))}</b>
        <span class="muted">— ${list.length} moment${list.length === 1 ? "" : "s"}</span>
        ${list.slice(0, SHOW).map(t => `<div class="mv" style="margin:3px 0">${esc(t.text)}
          <span class="muted">— ${esc(dateLabel(t.date))}${t.drill ? ", " + esc(t.drill) : ""}</span></div>`).join("")}
        ${extra > 0 ? `<div class="muted" style="margin-left:4px">and ${extra} more — pick a single week above to read them all</div>` : ""}
      </div>`; }).join("")}
  </div>`;
}

function yardageCard(week) {
  const t = yardTotals(week);
  const nums = Object.keys(t.per).filter(n => t.per[n].touches > 0)
    .sort((a, b) => t.per[b].yds - t.per[a].yds);

  const touches = nums.reduce((a, n) => a + t.per[n].touches, 0);
  const sign = v => (v > 0 ? "+" : "") + v;

  return `<div class="card">
    <h2 style="margin-top:0">Yardage</h2>
    <p class="muted">How far the ball actually moved, and who moved it. A gain is
      measured from where the ball started that rep to where it finished, so a play
      that ends behind the start shows as a loss.</p>

    <div class="scroll"><table>
      <tr><th>Player</th><th class="n">Touches<br><span class="muted" style="font-weight:400">measured</span></th>
          <th class="n">Yards<br><span class="muted" style="font-weight:400">on those</span></th>
          <th class="n">Per touch</th><th class="n">Best</th><th class="n">Worst</th></tr>
      ${nums.map(n => { const s = t.per[n];
        return `<tr><td>#${esc(n)} ${esc(nameOf(n) || "")}</td>
          <td class="n">${s.touches}</td>
          <td class="n"><b>${sign(s.yds)}</b></td>
          <td class="n">${Math.round(s.yds / s.touches * 10) / 10}</td>
          <td class="n">${sign(s.best)}</td>
          <td class="n">${s.worst < 0 ? `<span style="color:var(--bad)">${sign(s.worst)}</span>`
                                      : sign(s.worst)}</td></tr>`; }).join("")}
      <tr><td><b>All told</b></td><td class="n"><b>${touches}</b></td>
          <td class="n"><b>${sign(total)}</b></td>
          <td class="n"><b>${Math.round(total / touches * 10) / 10}</b></td>
          <td class="n"></td><td class="n"></td></tr>
    </table></div>

    <div class="mv" style="background:#f6f6f4;margin-top:10px">
      <b>What is not in this table.</b>
      ${t.dropped} of ${t.plays} plays had no readable finish — an incompletion, a drop,
      an interception, or a play where the yard line never got said — so they count as
      nothing rather than as zero.
      ${t.skipped.length ? `<br><br>These drills are left out altogether, because a yard
        number in them cannot be trusted: ${esc(t.skipped.join("; "))}. The ball moves
        between reps or the play runs the other way down the field, so a “gain” would be
        an arithmetic accident rather than football.` : ""}
    </div>
  </div>`;
}

/* ==========================================================================
   THE BOARD
   The players asked for this and they were right: they already know how the

   Counting stats and ratios, never percentages — a boy who catches 136 of 159

   ========================================================================== */
function gameScores() {

function boardRow(rank, who, big, small) {

  return `<tr><td style="width:34px;text-align:center;font-size:17px">${medal || `<span class="muted">${rank}</span>`}</td>
    <td><b>${esc(who)}</b></td>
    <td class="n" style="font-size:19px;font-weight:800">${esc(String(big))}</td>
    <td class="muted">${esc(small || "")}</td></tr>`;
}

function boardTable(title, blurb, rows) {
  if (!rows.length) return "";
  return `<div class="card">
    <h2 style="margin-top:0">${esc(title)}</h2>
    ${blurb ? `<p class="muted" style="margin-top:-4px">${esc(blurb)}</p>` : ""}
    <table>${rows.map((r, k) => boardRow(k + 1, r[0], r[1], r[2])).join("")}</table>
  </div>`;
}

function renderBoard() {
  const el = $("#boardArea");
  const gs = gameScores();
  const top = (arr, k) => arr.slice(0, k || 8);
  const games = BASELINE.games || [];

  /* touchdowns — the thing they asked for first */
  const tdRows = top(Object.keys(gs.td).sort((a, b) => gs.td[b] - gs.td[a])
    .map(who => {
      const ways = {};
      (gs.how[who] || []).forEach(w => ways[w] = (ways[w] || 0) + 1);
      const detail = Object.keys(ways).map(w => ways[w] + " " + w).join(", ");
      return [who, gs.td[who], detail];
    }), 8);

  /* kicking */
  const kickRows = Object.keys(gs.kick).sort((a, b) => gs.kick[b].made - gs.kick[a].made)
    .map(k => [k, gs.kick[k].made + " of " + gs.kick[k].tried, "extra points in games"]);

  /* takeaways and recoveries, from games only */
  const take = {}, takeHow = {};
  games.forEach(g => (g.takeaways || []).forEach(t => {
    take[t[0]] = (take[t[0]] || 0) + 1;
    (takeHow[t[0]] = takeHow[t[0]] || []).push(t[1]);
  }));
  const takeRows = top(Object.keys(take).sort((a, b) => take[b] - take[a]).map(w => {
    const ways = {}; (takeHow[w] || []).forEach(x => ways[x] = (ways[x] || 0) + 1);
    return [w, take[w], Object.keys(ways).map(x => ways[x] + " " + x).join(", ")];
  }));

  /* charted game play — catches, carries and snaps, from games read play by play */
  const gameItems = [];
  BASELINE.drills.filter(d => d.isGame).forEach(d => gameItems.push(...readDrill(d.id)));
  const G = statsFor(gameItems);
  const seen = Object.keys(G);
  const lone = x => {
    const base = x.replace(/[AB]$/, "");
    if (base === x) return x;
    return seen.some(y => y !== x && y.replace(/[AB]$/, "") === base) ? x : base;
  };
  const nm = x => "#" + lone(x) + " " + (nameOf(x) || "");
  const charted = BASELINE.drills.filter(d => d.isGame).length;

  const catchRows = top(Object.keys(G).filter(x => G[x].targets > 0)
    .sort((a, z) => G[z].catches - G[a].catches)
    .map(x => [nm(x), G[x].catches, "caught " + G[x].catches + " of " + G[x].targets + " thrown at him"]));

  const snapRows = top(Object.keys(G).filter(x => G[x].snaps > 0)
    .sort((a, z) => G[z].snaps - G[a].snaps)
    .map(x => [nm(x), G[x].snaps, "balls put in play"]));

  const touchRows = top(Object.keys(G).filter(x => (G[x].carries + G[x].catches) > 0)
    .sort((a, z) => (G[z].carries + G[z].catches) - (G[a].carries + G[a].catches))
    .map(x => [nm(x), G[x].carries + G[x].catches, G[x].carries + " carries, " + G[x].catches + " catches"]));

  /* stops, from the games where they were charted */
  const tk = {};
  games.forEach(g => (g.tackles || []).forEach(t => { tk[t.name] = (tk[t.name] || 0) + 1; }));
  const tackleRows = top(Object.keys(tk).sort((a, z) => tk[z] - tk[a]).map(w => [w, tk[w], "stops recorded"]));

  /* measured yards, games only */
  const yds = {}, ydPlays = {};
  games.forEach(g => ((g.yardage && g.yardage.plays) || []).forEach(r => {
    yds[r[0]] = (yds[r[0]] || 0) + r[1]; ydPlays[r[0]] = (ydPlays[r[0]] || 0) + 1;
  }));
  const ydRows = top(Object.keys(yds).filter(w => w !== "\u2014")
    .sort((a, b) => yds[b] - yds[a])
    .map(w => [w, (yds[w] > 0 ? "+" : "") + yds[w],
      "across " + ydPlays[w] + " plays we could measure \u2014 a sample, not his total"]));

  el.innerHTML = `
    <div class="card" style="background:var(--brand);color:#fff">
      <h2 style="margin:0;color:#fff">The board</h2>
      <p style="margin:6px 0 0;opacity:.92">Games only — all ${games.length} of them. Nothing from practice
        is on this page. Counting stats and ratios, never percentages.</p>
      ${charted < games.length ? `<p style="margin:8px 0 0;opacity:.92"><b>${charted} of ${games.length} games
        have been read play by play so far</b>, so catching, touches, stops and snaps only cover those. Touchdowns,
        takeaways and kicking cover every game.</p>` : ""}
    </div>

    ${boardTable("Touchdowns", "The one everybody wanted.", tdRows)}
    ${boardTable("Catching", "From the games read play by play. Ranked by balls caught, never by percentage.", catchRows)}
    ${boardTable("Touches", "Carries plus catches with the ball live.", touchRows)}
    ${boardTable("Stops", "Tackles named in the game recordings. Not every tackle was seen.", tackleRows)}
    ${boardTable("Snaps", "Every play starts here and nobody ever counts it.", snapRows)}
    ${boardTable("Takeaways and recoveries", "Balls won back off the other team, and loose balls fallen on.", takeRows)}
    <!-- Yards intentionally not shown. The first four games were narrated without a
         starting spot for the ball, so any per-play gain would be an estimate that is
         wrong often enough for a coach to catch. It comes back once enough games have
         been called with the down and distance, which gives an exact gain. -->
    ${(() => {
      /* A blocked kick is a blocking problem, not a kicking one. Saying "15 of 21"
         without that is unfair to the only specialist on the team. */
      let blocked = 0, other = 0;
      (BASELINE.games || []).forEach(g => (g.scoring || []).forEach(r => {
        if (!r[6] || /good/.test(r[7] || "")) return;
        if (/block/.test(r[7] || "")) blocked++; else other++;
      }));
      return boardTable("Kicking", "Extra points in games."
        + (blocked ? " Of the ones that did not go through, " + blocked + " were BLOCKED and only "
          + other + " missed — that is the line in front of him, not the kicker." : ""), kickRows);
    })()}
  `;
}

/* ---------- the coaches' and players' page ----------
   This used to be built around one week at a time: this week, the season before
   it, and an arrow for the change. That is how an analyst reads a season, and it
   is not how an eighteen-year-old reads his own name. The boys said it was too
   much to take in, so the page now leads with season totals and keeps weeks as a
   filter for anyone who wants one. No change arrows, no "too few reps", no
   comparison a reader has to hold two numbers in his head to understand. */
let SCOPE = "season";
function scopeWeek() { return SCOPE === "season" ? null : SCOPE; }
function scopeLabel() { return SCOPE === "season" ? "the whole season" : weekLabel(SCOPE); }
function scopeItems() {
  if (SCOPE !== "season") return itemsInWeek(SCOPE);
  let out = [];
  BASELINE.drills.forEach(d => { out = out.concat(readDrill(d.id)); });
  return out;
}
/* One line that answers the question they actually open the page to ask. */
function headline(n, s, tds) {
  const bits = [], touches = s.carries + s.rec, stops = s.tackles + s.ints + s.pbu + s.ff;
  if (tds) bits.push("<b>" + tds + (tds === 1 ? " touchdown" : " touchdowns") + "</b>");
  if (s.targets) bits.push("caught <b>" + s.catches + " of " + s.targets + "</b>");
  if (touches) bits.push("<b>" + touches + "</b> touches");
  if (s.att) bits.push("threw <b>" + s.comp + " of " + s.att + "</b>");
  if (s.snaps) bits.push("<b>" + s.snaps + "</b> snaps");
  if (stops) bits.push("<b>" + stops + (stops === 1 ? "</b> stop" : "</b> stops"));
  return bits.join(" &nbsp;·&nbsp; ");
}
function renderCoach() {
  const el = $("#coachArea"), ws = weeks();
  if (!ws.length) {
    el.innerHTML = `<div class="card"><h2>Nothing in here yet</h2>
      <p>This dashboard is empty and waiting for your first practice.</p></div>`;
    return;
  }
  if (SCOPE !== "season" && !ws.includes(SCOPE)) SCOPE = "season";
  const wk = scopeWeek();
  const items = scopeItems();
  const S = statsFor(items, wk);
  const gs = gameScores();
  const tdBy = {};
  Object.keys(gs.td).forEach(name => { const p = BASELINE.players.find(x => x.name === name);
    if (p) tdBy[String(p.num)] = gs.td[name]; });

  const involved = n => { const s = S[n] || blank();
    return (s.carries + s.rec) * 3 + s.snaps + (s.tackles + s.ints + s.pbu + s.ff) * 3 + s.targets; };
  const nums = Object.keys(S).sort((a, b) => involved(b) - involved(a)
    || (parseInt(a, 10) || 999) - (parseInt(b, 10) || 999));

  const pracs = wk ? BASELINE.practices.filter(p => mondayOf(p.date) === wk) : BASELINE.practices;
  const who = n => "#" + n + (nameOf(n) ? " " + nameOf(n) : "");
  const outNow = BASELINE.players.filter(pl => statusOf(pl.num, wk) !== "active");

  el.innerHTML = editBanner() + `
  ${BASELINE.note ? `<div class="warnbox noprint" style="margin-bottom:12px">${esc(BASELINE.note)}</div>` : ""}
  ${isOwner() ? `<div class="card noprint">
    <button class="btn primary wide big" onclick="showDebrief()"
      style="min-height:52px;font-size:16px">✉ Write the note for Coach</button>
  </div>` : ""}

  <div class="card" style="background:var(--brand);color:#fff">
    <h2 style="margin:0;color:#fff">${esc(BASELINE.team)}</h2>
    <p style="margin:6px 0 0;opacity:.92">${SCOPE === "season"
      ? `Everything recorded this season — ${pracs.length} practices and ${(BASELINE.games || []).length} games.`
      : `Week of ${esc(weekLabel(SCOPE))} — ${pracs.map(p => dateLabel(p.date)).join(" · ")}.`}
      ${items.filter(x => x.p && x.p.kind !== "set").length} plays recorded.</p>
  </div>

  <div class="card noprint">
    <div class="spread"><h2 style="margin:0">Showing</h2>
      <select id="wk" style="width:auto;min-height:40px;padding:7px 9px">
        <option value="season" ${SCOPE === "season" ? "selected" : ""}>The whole season</option>
        ${ws.map(w => `<option value="${w}" ${w === SCOPE ? "selected" : ""}>Week of ${esc(weekLabel(w))}</option>`).join("")}
      </select></div>
  </div>

  ${outNow.length ? `<div class="card"><h2 style="margin-top:0">Not in these numbers</h2>
    ${outNow.map(pl => `<div class="mv"><b>#${esc(pl.num)} ${esc(pl.name)}</b> — ${esc(statusOf(pl.num, wk))}</div>`).join("")}
  </div>` : ""}

  ${goodTackleCard(wk)}

  ${(() => {
    return "";
  })()}

  <div class="card">
    <h2 style="margin-bottom:2px">Everyone</h2>
    <p class="muted">Most involved first. Six-man means everyone does several jobs, so this is
      what each of them actually did rather than a listed position.</p>
    <div class="scroll"><table>
      <tr><th>Player</th><th>Did</th><th class="n">TDs</th><th class="n">Snaps</th>
      <th class="n">Caught</th><th class="n">Touches</th><th class="n">Stops</th></tr>
      ${nums.map(n => { const s = S[n] || blank();
        const stops = s.tackles + s.ints + s.pbu + s.ff;
        /* No praise stars beside names. Maddie catches only a fraction of what the
           coaches say from where she stands, so a boy without a star has not gone
           unpraised — she just did not hear it. A star would read as a ranking of
           who the coaches rate, which is not something this page knows. */
        return `<tr><td><b>#${esc(n)}</b> ${esc(nameOf(n) || "")}</td>
          <td class="muted">${esc(roleOf(s) || "—")}</td>
          <td class="n">${tdBy[n] || "—"}</td>
          <td class="n">${s.snaps || "—"}</td>
          <td class="n">${s.targets ? s.catches + " / " + s.targets : "—"}</td>
          <td class="n">${(s.carries + s.rec) || "—"}</td>
          <td class="n">${stops || "—"}</td></tr>`; }).join("")}
    </table></div>
  </div>

  ${nums.map(n => {
    const s = S[n] || blank(), line = headline(n, s, tdBy[n]);
    if (!line) return "";
    const stops = s.tackles + s.ints + s.pbu + s.ff;
    const row = (label, val, detail) => val
      ? `<tr><td>${esc(label)}</td><td class="n"><b>${val}</b></td><td class="muted">${detail || ""}</td></tr>` : "";
    return `<div class="card">
      <div class="spread"><h2 style="margin:0">${esc(who(n))}</h2>
        ${statusOf(n, wk) !== "active" ? `<span class="tag warn">${esc(statusOf(n, wk))}</span>` : ""}</div>
      <p style="margin:6px 0 10px;font-size:15px">${line}</p>
      <div class="scroll"><table>
        ${row("Touchdowns", tdBy[n], "in games")}
        ${row("Catching", s.targets ? s.catches + " of " + s.targets : 0, "balls thrown at him")}
        ${row("Touches", s.carries + s.rec, s.carries + " carried, " + s.rec + " caught")}
        ${row("Throwing", s.att ? s.comp + " of " + s.att : 0, "passes completed")}
        ${row("Snaps", s.snaps, "every play starts here")}
        ${row("Stops", stops, "tackles, interceptions and balls broken up that Maddie saw")}
      </table></div>
    </div>`;
  }).join("")}

  ${(() => {
    /* Every coach note in one place, at the end. Deliberately not on the player
       cards, and deliberately not ordered by who was praised most: Maddie hears a
       fraction of what is said on that field, so this is a record of what reached
       her, never a measure of who the coaches rate. */
    const cn = (BASELINE.coachNotes || []).filter(c => (!wk || mondayOf(c.date) === wk) && !c.private);
    if (!cn.length) return "";
    const team = cn.filter(c => !c.num), byNum = {};
    cn.filter(c => c.num).forEach(c => { (byNum[c.num] = byNum[c.num] || []).push(c); });
    const order = Object.keys(byNum).sort((a, b) => (parseInt(a, 10) || 999) - (parseInt(b, 10) || 999));
    const one = c => `<div style="margin:3px 0 7px">${noteMark(c.tone)}
      ${c.shorthand ? `<code>${esc(c.text)}</code>` : esc(c.text)}
      <span class="muted">— ${esc(c.by)}, ${esc(dateLabel(c.date))}${c.during ? ", " + esc(c.during) : ""}</span></div>`;
    return `<div class="card">
      <h2 style="margin-top:0">What the coaches said</h2>
      <p class="muted">★ marks praise. A bullet is a coaching point — something to work on,
        not a mark against anyone. <b>This is only what carried far enough to be heard from the
        sideline.</b> The coaches say a great deal more than this, and nobody is missing from the
        list because he was not praised.</p>
      ${team.length ? `<h3>To the whole team</h3>${team.map(one).join("")}` : ""}
      ${order.map(n => `<h3 style="margin-bottom:2px">${esc("#" + n + (nameOf(n) ? " " + nameOf(n) : ""))}</h3>
        ${byNum[n].map(one).join("")}`).join("")}
    </div>`;
  })()}

  <div class="card"><p class="muted">These are totals for ${esc(scopeLabel())}, not rates.
    Tackles are the ones Maddie saw and said so about — never a count of every tackle made.</p></div>`;

  $("#wk").onchange = e => { SCOPE = e.target.value; render(); };
}

/* ---------- every play, and fixing them ---------- */
function renderPlays() {
  const el = $("#playsArea");
  const prs = BASELINE.practices.slice().sort((a, b) => b.date.localeCompare(a.date));
  const odd = [];
  BASELINE.drills.forEach(d => oddities(d.id).forEach(o => odd.push({ d, o })));
  const unknown = unknownNumbers();
  if (!prs.length) {
    el.innerHTML = `<div class="card"><div class="empty">No practices yet.<br><br>
      Once a practice is in here, every play shows up on this tab and you can fix,
      remove or add any of them.</div></div>`;
    return;
  }
  el.innerHTML = editBanner()
  + (unknown.length ? `<div class="card"><h2>Numbers I don't recognise</h2>
      <p class="muted">Heard in a drill but not on the roster. The plays are kept — send me the names
      and they'll be filled in.</p>
      ${unknown.map(u => `<div class="mv">#${esc(u.num)} — heard ${u.times} time${u.times === 1 ? "" : "s"}</div>`).join("")}
    </div>` : "")
  + (odd.length ? `<div class="card"><h2>Worth a second look</h2>
      <p class="muted">These read fine as sentences but break the pattern the rest of their drill follows —
      which is what a misheard jersey number looks like. Not necessarily wrong, just worth checking.</p>
      ${odd.map(({ d, o }) => `<div class="mv">
        <b>${esc(dateLabel(practiceOf(d.practiceId).date))} · ${esc(d.name)} · play ${o.no}</b><br>
        <span class="muted">&ldquo;${esc(o.raw)}&rdquo;</span><br>
        ${o.why.map(w => `⚠ ${esc(w)}`).join("<br>")}
      </div>`).join("")}
    </div>` : "")
  + prs.map(p => {
    const ds = BASELINE.drills.filter(d => d.practiceId === p.id);
    return `<div class="card">
      <div class="spread"><h2 style="margin:0">${esc(dateLabel(p.date))}</h2>
        <span class="tag">${esc(p.session || "")}${p.weather && p.weather.temp ? " · " + esc(p.weather.temp) + "°" : ""}${
          p.weather && p.weather.wind ? ", wind " + esc(p.weather.wind) : ""}</span></div>
      ${ds.map(d => {
        const items = readDrill(d.id), bad = items.filter(isBad).length;
        return `<h3>${esc(d.name)} <span class="muted" style="text-transform:none;letter-spacing:0">
            ${d.startedAt ? esc(d.startedAt) + " – " + esc(d.endedAt || "?") : "time not recorded"}
            · ${items.length} plays${bad ? " · " + bad + " to check" : ""}</span></h3>
          ${d.note ? `<p class="muted" style="margin:-2px 0 8px;font-style:italic">${esc(d.note)}</p>` : ""}
          ${(d.feeders || d.relays) ? `<p class="muted" style="margin:-4px 0 8px">
            <b>Not scored in this drill:</b>
            ${(d.feeders || []).map(x => "#" + esc(x)).join(", ")} feeding ·
            ${(d.relays || []).map(x => "#" + esc(x)).join(", ")} relaying${
            d.style ? ` &nbsp;·&nbsp; style: <b>${esc(d.style)}</b>` : ""}</p>` : ""}
          <div class="log">${items.map(x => `
            <div class="li ${x.line.edited || x.line.added ? "edited" : isBad(x) ? "warn" : ""}" data-id="${x.line.id}">
              <div class="n">${x.no || "—"}</div>
              <div class="b">
                <div class="raw">${esc(x.line.raw)}
                  ${x.line.uncertain === "snapper" && !x.line.edited ? `<span class="tag warn">snapper unconfirmed</span>` : ""}
                  ${x.line.edited ? `<span class="tag blue">you fixed this</span>` : ""}
                  ${x.line.added ? `<span class="tag blue">you added this</span>` : ""}</div>
                <div class="say">${esc(say(x.p))}</div>
                ${isBad(x) && x.p ? `<div class="say" style="color:var(--warn);font-weight:700">${esc(x.p.warnings.join(" · "))}</div>` : ""}
              </div>
              ${isOwner() ? `<div class="row" style="flex-wrap:nowrap;gap:5px">
                <button class="btn sm noprint" data-fix="${x.line.id}">Fix</button>
                <button class="btn sm noprint" data-del="${x.line.id}">✕</button>
              </div>` : ""}
            </div>`).join("") || `<div class="empty">No plays.</div>`}</div>
          ${isOwner() ? `<button class="btn sm noprint" style="margin-top:8px" data-add="${d.id}">+ Add a play I missed</button>` : ""}`;
      }).join("")}
    </div>`;
  }).join("");

  $$("[data-fix]").forEach(b => b.onclick = () => fixLine(b.dataset.fix));
  $$("[data-del]").forEach(b => b.onclick = () => {
    const l = LINES().find(x => x.id === b.dataset.del);
    if (!l || !confirm("Remove this play?\n\n" + l.raw)) return;
    if (l.added) EDITS.added = EDITS.added.filter(x => x.id !== l.id);
    else { EDITS.deleted[l.id] = true; delete EDITS.changed[l.id]; }
    saveEdits(); render(); toast("Removed");
  });
  $$("[data-add]").forEach(b => b.onclick = () => fixLine(null, b.dataset.add));
}

function fixLine(id, drillId) {
  const l = id ? LINES().find(x => x.id === id) : null;
  const d = drillOf(l ? l.drillId : drillId);
  const kind = d.kind || (/pass/i.test(d.name) ? "rep" : "play");
  const orig = id ? (BASELINE.lines.find(x => x.id === id) || {}).raw : "";
  modal(`<h2>${id ? "Fix this play" : "Add a play"}</h2>
    <p class="muted">${esc(d.name)} · ${esc(dateLabel(practiceOf(d.practiceId).date))}</p>
    <label>What happened</label>
    <textarea id="fx" rows="3" placeholder="${kind === "rep" ? "40 caught 3, dropped 1"
      : "75 snapped to 6, passed to 8, tackled at the 25 by 14"}">${esc(l ? l.raw : "")}</textarea>
    <div class="card" id="fp" style="margin-top:9px;background:#eef4ee"></div>
    ${orig && l && l.raw !== orig ? `<p class="muted">Originally: ${esc(orig)}</p>` : ""}
    <div class="row" style="margin-top:13px">
      <button class="btn primary" style="flex:1" id="fs">Save</button>
      ${id && l.edited ? `<button class="btn" id="fr">Undo my change</button>` : ""}
      <button class="btn" id="fx2">Cancel</button></div>`, () => {
    const t = $("#fx"), pv = $("#fp");
    const upd = () => { const q = parseLine(t.value, { kind, startAbs: startFor(d) });
      pv.innerHTML = !q ? `<span class="muted">Type what happened and I'll read it back.</span>`
        : `<b>${esc(say(q))}</b>${q.warnings.length
          ? `<div class="say" style="color:var(--warn);font-weight:700;margin-top:4px">${esc(q.warnings.join(" · "))}</div>` : ""}${
          q.notes && q.notes.length ? `<div class="say" style="margin-top:4px">${esc(q.notes.join(" · "))}</div>` : ""}`; };
    t.oninput = upd; upd(); t.focus();
    $("#fs").onclick = () => {
      const v = t.value.trim(); if (!v) return closeModal();
      if (id) EDITS.changed[id] = v;
      else EDITS.added.push({ id: "add_" + uid(), drillId: d.id, raw: v });
      if (!saveEdits()) toast("Saved on screen, but this browser isn't keeping it — send your corrections");
      closeModal(); render();
    };
    if ($("#fr")) $("#fr").onclick = () => { delete EDITS.changed[id]; saveEdits(); closeModal(); render(); };
    $("#fx2").onclick = closeModal;
  });
}
</script>
<script>
"use strict";
/* ==========================================================================
   THE WEEKLY NOTE TO THE COACH
   A report nobody reads is the same as no report, so this is deliberately
   short, leads with things he can act on, and ends by asking him something.
   Plain text, because it has to survive being pasted into a text message.
   ========================================================================== */
const surname = n => { const nm = nameOf(n); return nm ? nm.split(/\s+/).slice(-1)[0] : ""; };
const tag = n => "#" + n + (surname(n) ? " " + surname(n) : "");

function debriefText(week) {
  const W = week || WEEK || weeks()[0];
  const prev = hasBefore(W) ? "before" : null;
  const now = statsFor(itemsInWeek(W), W);
  const was = prev ? statsFor(itemsBefore(W)) : {};
  const pracs = BASELINE.practices.filter(p => mondayOf(p.date) === W);
  const pracIds = pracs.map(p => p.id);
  const items = itemsInWeek(W);
  const nums = Object.keys(now).sort((a, b) => (parseInt(a, 10) || 999) - (parseInt(b, 10) || 999));
  const L = [];

  L.push(BASELINE.team.toUpperCase() + " — PRACTICE NOTES, week of " + weekLabel(W));
  L.push(pracs.length + " practice" + (pracs.length === 1 ? "" : "s") + " · "
    + items.filter(x => x.p && x.p.kind !== "set" && x.p.kind !== "style").length + " reps recorded");
  L.push("");

  /* --- the two or three findings most worth his time --- */
  const found = [];

  // catching by kind of pass, if the spread is real
  const styles = {};
  BASELINE.drills.filter(d => d.kind === "rep" && pracIds.includes(d.practiceId)).forEach(d => {
    readDrill(d.id).forEach(x => {
      if (!x.p || x.p.kind !== "tally") return;
      const k = x.p.style || d.style || "mixed";
      styles[k] = styles[k] || { c: 0, d: 0 };
      styles[k].c += x.p.counts.catch; styles[k].d += x.p.counts.drop;
    });
  });
  const sk = Object.keys(styles).filter(k => styles[k].c + styles[k].d >= 8 && k !== "mixed");
  if (sk.length >= 2) {
    const rate = k => styles[k].c / (styles[k].c + styles[k].d);
    const best = sk.reduce((a, b) => rate(a) >= rate(b) ? a : b);
    const worst = sk.reduce((a, b) => rate(a) <= rate(b) ? a : b);
    if (Math.round((rate(best) - rate(worst)) * 100) >= 12)
      found.push("Catching holds up on " + best + " (" + Math.round(rate(best) * 100) + "%) and falls away on "
        + worst + " (" + Math.round(rate(worst) * 100) + "%). Biggest gap we have.");
  }

  /* Who snapped and how often. Never how well — see the snapper table for why. */
  const snap = nums.filter(n => now[n].snaps >= 5).sort((a, b) => now[b].snaps - now[a].snaps);
  if (snap.length >= 2) {
    found.push("Snapping this week: " + snap.slice(0, 4)
      .map(n => tag(n) + " " + now[n].snaps).join(" · ") + ".");
  }

  // anyone with a clean sheet on real volume
  nums.forEach(n => {
    const s = now[n];
    if (s.targets >= 6 && s.drops === 0)
      found.push(tag(n) + " caught everything thrown at him this week (" + s.catches + " for " + s.targets + ").");
  });

  if (found.length) { L.push("WORTH KNOWING"); found.slice(0, 3).forEach(f => L.push("- " + f)); L.push(""); }

  /* --- movement, only where the sample supports it --- */
  if (prev) {
    const ups = [], downs = [];
    nums.forEach(n => {
      if (statusOf(n, WEEK) !== "active") return;
      /* One entry per player — his biggest move — so the note doesn't repeat
         the same kid three times for three views of the same thing. */
      let best = null;
      areaRows(now[n] || blank(), was[n] || blank()).forEach(r => {
        const m = moveWord(r); if (!m) return;
        const size = Math.abs(r.delta) / (r.a.unit === "%" ? 1 : 0.2);
        if (!best || size > best.size) best = { size, m, txt: tag(n) + " — "
          + r.a.label.toLowerCase() + " " + m.txt + " (" + r.detail + ")" };
      });
      if (best) (best.m.better ? ups : downs).push(best.txt);
    });
    const nPrev = BASELINE.practices.filter(p => mondayOf(p.date) === prev).length;
    if (pracs.length && nPrev && (pracs.length / nPrev < 0.6 || nPrev / pracs.length < 0.6))
      L.push("(" + pracs.length + " practice" + (pracs.length === 1 ? "" : "s") + " against "
        + nPrev + " last week, so treat the comparisons lightly.)");
    const already = found.join(" ");
    const fresh = arr => arr.filter(x => already.indexOf(x.split(" —")[0]) === -1);
    const u2 = fresh(ups), d2 = fresh(downs);
    if (u2.length) { L.push("MOVING UP"); u2.slice(0, 3).forEach(x => L.push("- " + x)); L.push(""); }
    if (d2.length) { L.push("SLIPPED"); d2.slice(0, 3).forEach(x => L.push("- " + x)); L.push(""); }
  }

  /* --- his own words, echoed back --- */
  const cn = (BASELINE.coachNotes || []).filter(c => mondayOf(c.date) === W && !c.private && c.tone === "praise");
  if (cn.length) {
    L.push("COMMENDED THIS WEEK");
    L.push("- " + cn.map(c => c.num ? tag(c.num) : "the team").join(", ") + ".");
    L.push("");
  }

  /* --- the part that makes him reply --- */
  const asks = [];
  const hasMatch = BASELINE.drills.filter(d => pracIds.includes(d.practiceId))
    .some(d => readDrill(d.id).some(x => x.p && x.p.kind === "matchup"));
  if (hasMatch) asks.push("Shock and lock: do you want me scoring the lock holding, or getting to the pad fast? They point opposite ways and I don't want to rank it wrong.");
  const gaps = items.filter(x => x.p && x.p.kind === "gap").length;
  if (gaps) asks.push(gaps + " rep" + (gaps === 1 ? "" : "s") + " I couldn't see. Tell me which drill matters most and I'll stand somewhere better.");
  if (asks.length) { L.push("COULD YOU TELL ME"); asks.forEach(a => L.push("- " + a)); L.push(""); }

  L.push("— Maddie");
  return L.join("\n");
}

function showDebrief() {
  const txt = debriefText(WEEK);
  modal(`<h2>Note for Coach Tinker</h2>
    <p class="muted">Short on purpose. Copy it straight into a text or email.</p>
    <textarea id="db" rows="18" style="font-family:ui-monospace,Menlo,monospace;font-size:13px">${esc(txt)}</textarea>
    <div class="row" style="margin-top:12px">
      <button class="btn primary" style="flex:1" id="db_c">Copy</button>
      <button class="btn" id="db_x">Close</button></div>`, () => {
    $("#db_c").onclick = () => {
      const t = $("#db"); t.select();
      if (navigator.clipboard) navigator.clipboard.writeText(txt).then(() => toast("Copied"));
      else { document.execCommand("copy"); toast("Copied"); }
    };
    $("#db_x").onclick = closeModal;
  });
}

/* ==========================================================================
   SENDING CORRECTIONS BACK
   Your fixes leave as plain English you can paste straight into the chat.
   ========================================================================== */
function correctionText() {
  const out = ["Corrections for " + BASELINE.team + " (dashboard " + BASELINE.version + ")", ""];
  Object.keys(EDITS.changed).forEach(id => {
    const b = BASELINE.lines.find(l => l.id === id); if (!b) return;
    const d = drillOf(b.drillId), p = practiceOf(d.practiceId);
    out.push("CHANGE — " + p.date + " " + d.name);
    out.push("   was: " + b.raw);
    out.push("   now: " + EDITS.changed[id]);
  });
  Object.keys(EDITS.deleted).forEach(id => {
    const b = BASELINE.lines.find(l => l.id === id); if (!b) return;
    const d = drillOf(b.drillId), p = practiceOf(d.practiceId);
    out.push("REMOVE — " + p.date + " " + d.name + ": " + b.raw);
  });
  EDITS.added.forEach(l => {
    const d = drillOf(l.drillId), p = practiceOf(d.practiceId);
    out.push("ADD — " + p.date + " " + d.name + ": " + l.raw);
  });
  if (out.length === 2) out.push("(nothing changed yet)");
  return out.join("\n");
}
function sendCorrections() {
  const txt = correctionText();
  modal(`<h2>Your corrections</h2>
    <p class="muted">Copy this and paste it to me. I'll fold it in and send back an updated dashboard.</p>
    <textarea id="ct" rows="12" style="font-family:ui-monospace,Menlo,monospace;font-size:13px">${esc(txt)}</textarea>
    <div class="row" style="margin-top:12px">
      <button class="btn primary" style="flex:1" id="cc">Copy</button>
      <button class="btn" id="cd">Save as a file</button>
      <button class="btn" id="cx">Close</button></div>`, () => {
    $("#cc").onclick = () => {
      const t = $("#ct"); t.select();
      if (navigator.clipboard) navigator.clipboard.writeText(txt).then(() => toast("Copied"));
      else { document.execCommand("copy"); toast("Copied"); }
    };
    $("#cd").onclick = () => {
      const b = new Blob([txt], { type: "text/plain" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(b);
      a.download = "corrections-" + new Date().toISOString().slice(0, 10) + ".txt";
      document.body.appendChild(a); a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
    };
    $("#cx").onclick = closeModal;
  });
}

/* ==========================================================================
   GAMES — a walled garden.

   Game jerseys are not practice jerseys, and the other team wears some of the
   same numbers. So none of this touches players[], LINES(), or any statistic
   on the other tabs. It is rendered straight from BASELINE.games and nothing
   reads back out of it.
   ========================================================================== */
function renderGame() {
  const gs = BASELINE.games || [];
  if (!gs.length) { $("#gameArea").innerHTML = "<p class=\"muted\">No games recorded yet.</p>"; return; }
  /* newest game first — a coach opening this wants last night, not August */
  $("#gameArea").innerHTML = gs.slice().sort((a, z) => (z.date || "").localeCompare(a.date || "")).map(g => {
    const pct = (c, d) => (c + d) ? Math.round(c / (c + d) * 100) + "%" : "—";
    const NAME = {}; g.map.forEach(m => NAME[m[0]] = m[1]);
    const PRAC = {}; g.map.forEach(m => PRAC[m[0]] = m[2]);
    const who = nm => NAME[nm] ? esc(NAME[nm]) : "<span class=\"muted\">not on the team sheet</span>";

    return `
    <div class="card">
      <div class="spread"><h2 style="margin:0">${esc(BASELINE.team)} v ${esc(g.opponent)}</h2>
        <div style="font-size:26px;font-weight:800">${g.us}–${g.them}</div></div>
      <p class="muted" style="margin:2px 0 0">${esc(dateLabel(g.date))}${g.kickoff ? " · kickoff " + esc(g.kickoff) : ""}</p>
      <p class="muted" style="margin:6px 0 0">${esc(g.opponentNote || "")}</p>
    </div>


    ${(g.nameConflicts || []).length ? `<div class="card"><h3 style="margin-top:0">Two spellings, one boy</h3>
      <p class="muted">Your practice roster and your team sheet disagree. Tell me which is right and I will fix both.</p>
      <table class="tbl"><thead><tr><th>Who</th><th>Practice roster</th><th>Team sheet</th><th></th></tr></thead>
      <tbody>${g.nameConflicts.map(c => `<tr><th>${esc(c[0])}</th><td>${esc(c[1])}</td>
        <td>${esc(c[2])}</td><td class="muted">${esc(c[3])}</td></tr>`).join("")}</tbody></table>
    </div>` : ""}


    <div class="card"><h3 style="margin-top:0">How the scoring went</h3>
      <table class="tbl"><thead><tr><th>Qtr</th><th>Who</th><th>What happened</th><th>Score</th></tr></thead>
      <tbody>${g.scoring.map(r => `<tr><td>${esc(r[0])}</td><th>${esc(r[1])}</th>
        <td>${esc(r[2])}</td><td><b>${esc(r[3])}</b></td></tr>`).join("")}</tbody></table>
    </div>

    <!-- The per-game yardage sample is deliberately not rendered. The data is still in
         BASELINE under game.yardage; it was only ever a subset of plays and reads as a
         total, which is worse than showing nothing. -->

    <div class="card"><h3 style="margin-top:0">What worked</h3>
      ${(g.worked || []).map(r => `<div style="margin:9px 0"><b>${esc(r[0])}</b> — ${esc(r[1])}</div>`).join("")}
    </div>

    <div class="card"><h3 style="margin-top:0">What didn't</h3>
      ${(g.didnt || []).map(r => `<div style="margin:9px 0"><b>${esc(r[0])}</b> — ${esc(r[1])}</div>`).join("")}
      ${g.shape ? `<div class="mv" style="background:#eef2ff;border-color:#6366f1;margin-top:10px">
        ${esc(g.shape)}</div>` : ""}
    </div>

    ${(g.injuries || []).length ? `<div class="card"><h3 style="margin-top:0">Injuries</h3>
      ${g.injuries.map(r => `<div style="margin:9px 0"><b>${esc(r[0])}</b> — ${esc(r[1])}</div>`).join("")}
    </div>` : ""}

    <div class="card"><h3 style="margin-top:0">Individual moments</h3>
      ${g.notable.map(r => `<div style="margin:7px 0"><b>${esc(r[1])}</b> — ${esc(r[2])}</div>`).join("")}
    </div>

    <div class="card"><h3 style="margin-top:0">Maddie's note</h3>
      <p>${esc(g.maddie)}</p></div>`;
  }).join("");
}

function renderMore() {
  const el = $("#moreArea");
  el.innerHTML = `
  <div class="card">
    <h2>About this file</h2>
    <p class="muted">Built ${esc(BASELINE.version)} · ${BASELINE.practices.length} practices ·
      ${BASELINE.lines.length} plays · ${BASELINE.players.length} players</p>
    <div class="okbox" style="margin-top:9px">The practice data is written into this file.
      It is never saved to the browser, so it cannot go missing. Opening a second copy of this
      file is harmless — it's a document, not a database.</div>
    ${EDITSOK ? "" : `<div class="warnbox" style="margin-top:9px">This browser isn't keeping your
      corrections between visits. Send them before you close the page.</div>`}
    ${EDITS.stale ? `<div class="warnbox" style="margin-top:9px">You had corrections from an older
      dashboard. They should already be folded into this one, so I've set them aside rather than
      applying them twice.</div>` : ""}
  </div>

  <div class="card">
    <h2>Corrections</h2>
    <p class="muted">${editCount()} pending.</p>
    <button class="btn primary wide" onclick="sendCorrections()">Show my corrections</button>
    ${editCount() ? `<button class="btn wide bad" style="margin-top:8px" id="wipe">Throw my corrections away</button>` : ""}
  </div>

  ${(BASELINE.glossary || []).length ? `<div class="card">
    <h2>Coach shorthand</h2>
    <p class="muted">Terms decoded so far. Coach notes are stored exactly as written — nothing is
      guessed at. Add a term here once and every note using it becomes readable.</p>
    <div class="scroll"><table><tr><th>Term</th><th>Means</th></tr>
      ${BASELINE.glossary.map(g => `<tr><td><code>${esc(g.term)}</code></td><td>${esc(g.means)}</td></tr>`).join("")}
    </table></div>
    <p class="muted" style="margin-top:8px">Ask Coach Tinker for his key once and this fills itself in.</p>
  </div>` : ""}

  ${(BASELINE.coachNotes || []).filter(c => c.private).length ? `<div class="card">
    <h2>Your own notes</h2>
    <p class="muted">Kept out of the coaches' page.</p>
    ${BASELINE.coachNotes.filter(c => c.private).map(c =>
      `<div class="mv">${esc(c.text)} <span class="muted">— ${esc(dateLabel(c.date))}</span></div>`).join("")}
  </div>` : ""}

  <div class="card">
    <h2>Roster</h2>
    <div class="scroll"><table><tr><th>#</th><th>Name</th><th>Year</th></tr>
      ${BASELINE.players.filter(p => p.num).slice()
        .sort((a,b)=>(parseInt(a.num,10)||999)-(parseInt(b.num,10)||999))
        .map(p => `<tr><td><b>#${esc(p.num)}</b></td><td>${esc(p.name || "")}${
          (p.status || "active") !== "active" ? ` <span class="tag warn">${esc(p.status)}</span>` : ""}</td>
          <td class="muted">${esc(p.year || "")}</td></tr>`).join("")}
    </table></div>
    ${BASELINE.players.filter(p => !p.num).length ? `
      <h3>On the roster, no jersey yet</h3>
      <p class="muted">Nothing can be tracked to them until they have a number, so they are kept
        here rather than dropped.</p>
      <div class="scroll"><table><tr><th>Name</th><th>Year</th></tr>
        ${BASELINE.players.filter(p => !p.num).map(p =>
          `<tr><td>${esc(p.name)}</td><td class="muted">${esc(p.year || "")}</td></tr>`).join("")}
      </table></div>` : ""}
    <p class="muted" style="margin-top:8px">Send me roster changes and they'll be in the next one.</p>
  </div>`;
  if ($("#wipe")) $("#wipe").onclick = () => {
    if (!confirm("Throw away all " + editCount() + " corrections? The practices themselves stay.")) return;
    EDITS = { baseline: BASELINE.version, changed: {}, deleted: {}, added: [] };
    saveEdits(); render(); toast("Corrections cleared");
  };
}

$$("nav.tabs button").forEach(b => b.onclick = () => go(b.dataset.view));
$("#btnMore").onclick = () => go(VIEW === "more" ? "coach" : "more");
$("#btnPrint").onclick = () => window.print();
go("coach");
</script>
